name: WMK Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wmk-windows.yml"
      - "assets/wmk-brand/**"
      - "apps/photocraft/**"
      - "crates/ui-egui/src/panels/**"
      - "crates/ui-egui/src/lib.rs"
      - "crates/ui-egui/src/os_window.rs"
      - "apps/photocraft-web/**"
      - "apps/photocraft-web-boot/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "crates/**"
      - "wmk-tools/**"
      - "craft-i18n.rev"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CRAFT_I18N_REQUIRED: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Rust 1.95
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Baixar catalogos de idioma
        shell: pwsh
        run: |
          git clone https://github.com/storytold/craft-i18n.git "$env:RUNNER_TEMP\craft-i18n"
          $revision = (Get-Content craft-i18n.rev -Raw).Trim()
          git -C "$env:RUNNER_TEMP\craft-i18n" checkout --detach $revision
          if ($LASTEXITCODE -ne 0) { throw "Revisao de traducao indisponivel: $revision" }
          "CRAFT_I18N_DIR=$env:RUNNER_TEMP\craft-i18n" >> $env:GITHUB_ENV
          if (!(Test-Path "$env:RUNNER_TEMP\craft-i18n\locales\pt-br\photocraft.tsv")) { throw "Catalogo pt-BR nao encontrado" }
      - name: Gerar icones WMK a partir da identidade vetorial
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts=false sharp
          @'
          const sharp = require('sharp');
          const fs = require('fs');
          const dir = 'assets/app-icon';
          const maskSvg = (size) => Buffer.from('<svg width="'+size+'" height="'+size+'"><rect width="'+size+'" height="'+size+'" rx="'+Math.round(size*0.22)+'" fill="white"/></svg>');
          const icon = (size) => sharp(svg).extract({left:170,top:90,width:620,height:310}).resize(size,size,{fit:'contain',background:'#06101d'}).png().composite([{input:maskSvg(size),blend:'dest-in'}]).png().toBuffer();
          const svg = fs.readFileSync('assets/wmk-brand/wmk-photo-studio.svg');
          (async () => {
            const sizes = [16,24,32,48,64,128,256,512];
            for (const size of sizes) {
              const path = dir + '/hicolor/' + size + 'x' + size + '/apps/ai.storyteller.photocraft.png';
              fs.mkdirSync(require('path').dirname(path), {recursive:true});
              fs.writeFileSync(path, await icon(size));
            }
            await sharp(svg).resize(1024,1024,{fit:'contain',background:'#06101d'}).png().toFile(dir + '/photocraft-1024.png');
            // ICO multiresolucao: cabecalho ICO + imagens PNG.
            const icons = await Promise.all([16,24,32,48,64,128,256].map(s => icon(s)));
            let offset = 6 + icons.length * 16;
            const header = Buffer.alloc(offset);
            header.writeUInt16LE(1,2); header.writeUInt16LE(icons.length,4);
            icons.forEach((img,i) => {const s=[16,24,32,48,64,128,256][i], p=6+i*16; header[p]=s===256?0:s;header[p+1]=s===256?0:s;header.writeUInt16LE(1,p+4);header.writeUInt16LE(32,p+6);header.writeUInt32LE(img.length,p+8);header.writeUInt32LE(offset,p+12);offset+=img.length;});
            fs.writeFileSync(dir+'/photocraft.ico',Buffer.concat([header,...icons]));
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content -Encoding UTF8 wmk-generate-icons.cjs
          node wmk-generate-icons.cjs
      - name: Testes WMK sem abrir GUI
        shell: pwsh
        run: |
          python -m unittest discover -s wmk-tools -p "test_*.py" -v
      - name: Compilar editor Windows x64
        shell: pwsh
        run: |
          cargo build --locked --release -p photocraft -p photocraft-cli
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar" }
          & target/release/photocraft-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "CLI nao iniciou" }
      - name: Montar pacote portatil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/photocraft.exe dist/WMK-Photo-Studio.exe
          if (Test-Path target/release/photocraft-cli.exe) { Copy-Item target/release/photocraft-cli.exe dist/WMK-Photo-Studio-CLI.exe }
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE,NOTICE,ATTRIBUTION.md dist/
          Copy-Item assets/wmk-brand/wmk-photo-studio.svg dist/
          Copy-Item -Recurse wmk-tools dist/wmk-tools
          Copy-Item docs/WMK-LOTE.md dist/GUIA-LOTE.md
          Get-FileHash dist/WMK-Photo-Studio.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  WMK-Photo-Studio.exe" } | Set-Content -Encoding ascii dist/SHA256.txt
          Compress-Archive -Path dist/* -DestinationPath WMK-Photo-Studio-Windows-x64.zip -Force
      - name: Publicar ZIP de estudos
        uses: actions/upload-artifact@v4
        with:
          name: WMK-Photo-Studio-Windows-x64
          path: WMK-Photo-Studio-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publicar versao de testes para download publico
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          $tag = "wmk-preview-${{ github.run_number }}-$shortSha"
          @'
          # WMK Photo Studio — Windows x64 (prévia experimental)

          **Versão de estudos não assinada.** Compilada automaticamente no GitHub Actions.

          - Inclui WMK-Photo-Studio.exe, WMK-Photo-Studio-CLI.exe, documentação em português e licenças.
          - Descompacte o ZIP antes de executar.
          - Faça backup dos originais: a base PhotoCraft ainda está em estágio alpha.
          - Compilação automatizada e teste básico da CLI não equivalem a validação visual completa em Windows 10/11.
          - Mantenha os avisos originais PhotoCraft / ArtCraft; branding WMK por Walney Moreira Klein.

          Veja o README para limitações e o roadmap.
          '@ | Set-Content -Encoding utf8 NOTAS-VERSAO.md
          gh release create $tag "WMK-Photo-Studio-Windows-x64.zip" --repo "${{ github.repository }}" --title "WMK Photo Studio — Prévia Windows #${{ github.run_number }}" --notes-file NOTAS-VERSAO.md --prerelease --target "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel publicar a versao no GitHub Releases" }
